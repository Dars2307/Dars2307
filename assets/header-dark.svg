<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Joel Ogunniyi, Edinburgh, Scotland" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b7cf6"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b7cf6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.1s" fill="freeze"/>
    <text x="48" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="3.4" fill="#7d8590">BUILDING TOOLS THAT CARRY CONTEXT</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.35s" fill="freeze"/>
    <text x="46" y="158" font-family="Georgia, 'Times New Roman', serif"
          font-size="68" fill="#e6edf3">Joel Ogunniyi</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
    <text x="48" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14" letter-spacing="3" fill="#7d8590">SOFTWARE ENGINEERING STUDENT</text>
    <text x=3800 y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14" letter-spacing="3" fill="#484f58">/</text>
    <text x40452" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14" letter-spacing="3" fill="#7d8590">EDINBURGH, SCOTLAND</text>
  </g>

  <rect x="48" y="226" width="1104" height="1" fill="url(#rule)"/>

  <path id="line-d"
        d="M48 282 C 300 240, 470 318, 700 276 S 1010 252, 1152 286"
        fill="none" stroke="url(#thread)" stroke-width="1.8" stroke-linecap="round"
        stroke-dasharray="1500" stroke-dashoffset="1500">
    <animate attributeName="stroke-dashoffset" from="1500" to="0" dur="2.6s" begin="0.8s"
             calcMode="spline" keySplines="0.22 1 0.36 1" fill="freeze"/>
  </path>

  <g fill="#8b7cf6">
    <circle cx="48" cy="282" r="3.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="392" cy="272" r="3.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="276" r="3.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="952" cy="262" r="3.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1152" cy="286" r="3.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="4.6" fill="#22d3ee" filter="url(#soft)" opacity="0">
    <animateMotion dur="7s" begin="3.2s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#line-d" href="#line-d"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.12;0.86;1"
             dur="7s" begin="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
